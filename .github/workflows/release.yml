name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows EXE and Create Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        shell: powershell
        run: |
          pyinstaller --onefile --noconsole --name "DHL_Label_Tool" `
            --exclude-module torch --exclude-module scipy --exclude-module sympy `
            --exclude-module pandas --exclude-module onnxruntime --exclude-module matplotlib `
            --exclude-module jinja2 --exclude-module lxml dhl_label_splitter.py

      - name: Verify build artifact
        shell: powershell
        run: |
          if (-not (Test-Path "dist\DHL_Label_Tool.exe")) {
            Write-Error "DHL_Label_Tool.exe was not created in dist/"
            exit 1
          }
          Get-Item "dist\DHL_Label_Tool.exe" | Select-Object Name, Length

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "Release v${{ inputs.version }}"
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/DHL_Label_Tool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
